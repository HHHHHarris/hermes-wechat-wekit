[project]
name = "hermes-wechat-wekit"
version = "0.1.0"
description = "WeChat platform plugin for Hermes Agent, driving the real WeChat app through the WeKit module on a rooted Android phone"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/HHHHHarris/hermes-wechat-wekit"
Issues = "https://github.com/HHHHHarris/hermes-wechat-wekit/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
